[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oktopai"
version = "0.1.0"
description = "An experimental local-LLM coding orchestrator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oktopai = "oktopai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

